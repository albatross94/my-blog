<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>2048</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">2048</h1>
      <div class="scores" aria-live="polite">
        <div class="scores__box">
          <span class="scores__label">점수</span>
          <span class="scores__value" id="score">0</span>
        </div>
        <div class="scores__box">
          <span class="scores__label">최고</span>
          <span class="scores__value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <p class="toolbar__hint">타일을 밀어 같은 숫자를 합쳐 2048을 만드세요.</p>
      <button type="button" class="btn" id="new-game" aria-label="새 게임 시작">새 게임</button>
    </div>

    <section class="board" id="board" aria-label="게임 보드">
      <div class="board__cells" id="cells"></div>
      <div class="board__tiles" id="tiles"></div>

      <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" hidden>
        <h2 class="overlay__title" id="overlay-title"></h2>
        <div class="overlay__actions">
          <button type="button" class="btn" id="overlay-continue" aria-label="계속하기" hidden>계속하기</button>
          <button type="button" class="btn btn--primary" id="overlay-new" aria-label="새 게임 시작">새 게임</button>
        </div>
      </div>
    </section>

    <p class="help">방향키 또는 WASD, 모바일에서는 스와이프로 조작합니다.</p>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
