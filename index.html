<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    // FOUC 방지: 렌더링 전에 저장된 테마를 적용한다.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/post.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
        <span aria-hidden="true" class="theme-toggle__icon"></span>
      </button>
    </div>
  </header>

  <main class="container" id="app" aria-live="polite"></main>

  <section class="container apps" aria-labelledby="apps-title">
    <h2 class="apps__heading" id="apps-title">미니 웹앱</h2>
    <article class="app-card">
      <h3 class="app-card__title">2048</h3>
      <p class="app-card__desc">방향키(모바일은 스와이프)로 숫자 타일을 밀어 같은 숫자를 합치는 퍼즐 게임. 점수판과 최고 점수 저장을 지원합니다.</p>
      <iframe class="app-card__frame" src="apps/2048/" title="2048 게임 미리보기" loading="lazy"></iframe>
      <a class="app-card__link" href="apps/2048/">전체 화면으로 열기</a>
    </article>
    <article class="app-card">
      <h3 class="app-card__title">픽셀 아트 에디터</h3>
      <p class="app-card__desc">16×16 격자에 도트를 찍어 그림을 그리고, 16색 팔레트로 색을 고른 뒤 PNG로 저장할 수 있습니다.</p>
      <iframe class="app-card__frame app-card__frame--tall" src="apps/pixel-editor/" title="픽셀 아트 에디터 미리보기" loading="lazy"></iframe>
      <a class="app-card__link" href="apps/pixel-editor/">전체 화면으로 열기</a>
    </article>
  </section>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> My Blog</div>
  </footer>

  <script src="js/vendor/marked.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
